<!DOCTYPE html>
<html>
<head>
   
    <title>DIV ile HTML Web Sayfası Şablonu</title>
    <style>
      header{
       width: 603px;
       border:1px solid rgb(0, 0, 0);
       background-color: rgb(38, 0, 255);
       height: 60px;
       line-height: 60px;
       text-align: center;
      }

      nav{
       width: 200px;
       border:1px solid rgb(0, 0, 0);
       background-color: rgb(0, 55, 128);
       height: 40px;
       line-height: 40px;
       text-align: center;
       float: left;
      }
       section{
       width: 400px;
       border:1px solid rgb(0, 0, 0);
       background-color: rgb(38, 0, 255);
       height: 100px;
       line-height: 100px;
       text-align: center;
      }
      

      footer{
        width:603px;
        border:1px solid rgb(38, 0, 255);
        background-color: gray;
        height:60px;
        line-height: 60px;
        text-align: center;
        clear: left;
      }
      



    </style>
</head>
<body>
    <header style="color: aliceblue;">MTAL Robotik Projesi</header>
    <nav style="color: aliceblue;">Ana Sayfa</nav>
    <nav style="color: aliceblue;">Proje Ekibi</nav>
    <nav style="color: aliceblue;">İletişim Formu</nav>
    <seciton style="color: aliceblue;">Section</seciton>
    <footer style="color: aliceblue;">FOOTER</footer>
</body>
</html>
