<!DOCTYPE html>
<html>
<head>
   
    <title>DIV ile HTML Web Sayfası Şablonu</title>
    <style>
      header{
       width: 603px;
       border:1px solid rgb(0, 0, 0);
       background-color: rgb(38, 0, 255);
       height: 60px;
       line-height: 20px;
       text-align: center;
      }

      nav{
       width: 200px;
       border:1px solid rgb(0, 0, 0);
       background-color: rgb(0, 55, 128);
       height: 40px;
       line-height: 40px;
       text-align: center;
       float: left;
      }
    section{
       width: 603px;
       border:1px solid rgb(0, 0, 0);
       background-color: rgb(227, 226, 238);
       height: 300px;
       line-height: 100px;
       
      }
      

      footer{
        width:603px;
        border:1px solid rgb(0, 0, 0);
        background-color: rgb(1, 47, 255);
        height:60px;
        line-height: 60px;
        text-align: center;
        clear: left;
      }
      



    </style>
</head>
<body>
    <header style="color: aliceblue;"><h1>MTAL Robotik Projesi</h1></header>
    <nav style="color: aliceblue;">Ana Sayfa</nav>
    <nav style="color: aliceblue;">Proje Ekibi</nav>
    <nav style="color: aliceblue;">İletişim Formu</nav>
    <section style="color: rgb(0, 0, 0);"><h1>Akıllı Robot Projesi</h1>
        <p>Bu proje,öğrencilerimizin teknolojiye olan ilgilerini artırmak ve robotik alınında uygulamalı öğrenme imkanı sunmak amacıyla geliştirilmiştir.</p>



    </section>
    <footer style="color: aliceblue;">FOOTER</footer>
</body>
</html>
