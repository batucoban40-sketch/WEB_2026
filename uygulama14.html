<!DOCTYPE html>
<html>
<head>
    <style>
        P{
            font-size: 70px;
            font-style: italic;
            font-weight: bold;
            font-family: Arial, sans-serif;
            color: rgba(70, 72, 177, 0.795);
            letter-spacing: 2px;
            word-spacing: 5px;
            word-wrap: break-word;
            line-height: 1.5;
            text-transform: uppercase;
            text-decoration: underline;
            text-align: center;
            text-indent: 50px;
            text-shadow: 2px 2px 4px #000000;
            text-overflow: ellipsis;
            
        }
        img{
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 30%;
            border: 5px solid #6d85f1d3;
        }
        div{
            width: 40%;
            height: 400px;
            border-color: #000000;
            border-style: solid;
            border-width: 5px;
            border-radius: 10px;
            background-color: rgb(114, 114, 202);
            margin:auto;
            font-size: 50px;
            text-align: center;
            background-image: url("frutiger.jpg");
        
        }
        body{
            background-image: url("uzay.jpg");
            background-repeat: no-repeat;
            background-size: cover;
        }
    </style>
</head>
<body>
    <p>JUPITER INCIDENT</p>
    <img src="resim.webp" alt="JUPITER INCIDENT">
    <div style="color: rgb(150, 120, 231);">JUPİTER 2011</div>
</body>
</html>
