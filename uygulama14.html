<!DOCTYPE html>
<html>
<head>
    <style>
        P{
            font-size: 70px;
            font-style: italic;
            font-weight: bold;
            font-family: Arial, sans-serif;
            color: rgb(0, 0, 0);
            letter-spacing: 2px;
            word-spacing: 5px;
            word-wrap: break-word;
            line-height: 1.5;
            text-transform: uppercase;
            text-decoration: underline;
            text-align: center;
            text-indent: 50px;
            text-shadow: 2px 2px 4px #000000;
            text-overflow: ellipsis;
            
        }
        img{
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 50%;
        }
    </style>
</head>
<body>
    <p>JUPITER INCIDENT</p>
    <img src="resim.webp" alt="JUPITER INCIDENT">
</body>
</html>
