<!DOCTYPE html>
<html>
<head>
    <style>
        P{
            font-size: 70px;
            font-style: italic;
            font-weight: bold;
            font-family: Arial, sans-serif;
            color: rgba(1, 5, 248, 0.795);
            letter-spacing: 2px;
            word-spacing: 5px;
            word-wrap: break-word;
            line-height: 1.5;
            text-transform: uppercase;
            text-decoration: underline;
            text-align: center;
            text-indent: 50px;
            text-shadow: 2px 2px 4px #000000;
            text-overflow: ellipsis;
            
        }
        img{
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 50%;
            border: 5px solid #f1d36dd3;
        }
        div{
            width: 100%;
            height: 500px;
            border-color: #000000;
            border-style: solid;
            border-width: 5px;
            border-radius: 10px;
            background-color: darkblue;
            text-size: 50px;
        }
    </style>
</head>
<body>
    <p>JUPITER INCIDENT</p>
    <img src="resim.webp" alt="JUPITER INCIDENT">
    <div style="color: white;">JUPİTER 2011</div>
</body>
</html>
