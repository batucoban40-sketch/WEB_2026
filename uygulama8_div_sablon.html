<!DOCTYPE html>
<html>
<head>
   
    <title>DIV ile HTML Web Sayfası Şablonu</title>
    <style>
      #header{
       width: 900px;
       border:1px dotted darkblue;
       background-color: orange;
       height: 60px;
       line-height: 60px;
       text-align: center;
      }

      #nav{
       width: 200px;
       border:1px dotted darkblue;
       background-color: purple;
       height: 300px;
       line-height: 300px;
       text-align: center;
      }


    </style>
</head>
<body>
    <div id="header">HEADER</div>
    <nav id="nav">NAV</nav>
</body>
</html>
