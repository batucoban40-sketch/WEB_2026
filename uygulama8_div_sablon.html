<!DOCTYPE html>
<html>
<head>
   
    <title>DIV ile HTML Web Sayfası Şablonu</title>
    <style>
      #header{
       width: 900px;
       border:1px solid rgb(0, 0, 0);
       background-color: orange;
       height: 60px;
       line-height: 60px;
       text-align: center;
      }

      #nav{
       width: 200px;
       border:1px solid rgb(0, 0, 0);
       background-color: purple;
       height: 300px;
       line-height: 300px;
       text-align: center;
       float: left;
      }

      #section{
       width: 500px;
       border:1px solid rgb(0, 0, 0);
       background-color: rgb(194, 109, 194);
       height: 300px;
       line-height: 70px;
       text-align: center;
       float: left;
      }

      #aside{
       width: 200px;
       border:1px solid rgb(0, 0, 0);
       background-color: rgb(28, 72, 192);
       height: 300px;
       line-height: 300px;
       text-align: center;
       float: left;
      }

      #footer{
        width:900px;
        border:1px solid rgb(0, 0, 0);
        background-color: gray;
        height:60px;
        line-height: 60px;
        text-align: center;
        clear: left;
      }
      
      #sheader{
                width:90%;
                border:1px solid rgb(0, 0, 0);
                height:40px;
                background-color:rgb(243, 4, 183);
                text-align: center;
                line-height: 40px;  
                margin:auto auto;
      }

      #article{
                width:90%;
                border:1px solid rgb(0, 0, 0);
                height:40px;
                background-color:rgb(235, 212, 7);
                text-align: center;
                line-height: 40px;  
                margin:20px auto;
      }

     #sfooter{
                width:90%;
                border:1px solid rgb(0, 0, 0);
                height:40px;
                background-color:rgb(255, 0, 0);
                text-align: center;
                line-height: 40px;  
                margin:auto auto;
      }



    </style>
</head>
<body>
    <div id="header">HEADER</div>
    <div id="nav">NAV</div>
    <div id="section">SECTİON

        <div id="sheader">HEADER</div>
        <div id="article">ARTİCLE</div>
        <div id="sfooter">FOOTER</div>

    </div>
    <div id="aside">ASİDE</div>
    <div id="footer">FOOTER</div>
</body>
</html>
